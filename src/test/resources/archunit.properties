# ArchUnit solo necesita las clases del proyecto para evaluar los ciclos entre paquetes.
# No resolver dependencias faltantes desde el classpath evita que intente leer las clases
# del JDK 25 (formato de clase mas nuevo que el que soporta ArchUnit 1.3.0), lo que solo
# producia advertencias "Error during import from jrt:/..." en la salida de las pruebas.
resolveMissingDependenciesFromClassPath=false
